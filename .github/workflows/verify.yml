name: Verify Civic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # API unit tests substitute synthetic biometric samples.
      - run: python -m pip install Flask flask-cors Flask-Limiter python-dotenv numpy 'eth-account>=0.13,<0.14' 'eth-abi>=5.2,<6' 'eth-utils>=5,<6' pytest
      - run: python -m pytest server/tests -q
